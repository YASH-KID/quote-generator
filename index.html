<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="icon.ico">
<title>Quote Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
    <span id="themeIcon">🌙</span>
  </button>

  <div class="card">
    <p class="quote-mark">&ldquo;</p>
    <p class="quote-text" id="quoteText"></p>
    <p class="quote-author" id="quoteAuthor"></p>
    <button id="newQuoteBtn" class="new-quote-btn">New Quote</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
